# Только для разработки.
# Dev-сервер (hot reload):  docker compose up --watch → http://localhost:5173
#   исходники синхронизируются в контейнер (develop.watch), образ пересобирается при смене зависимостей
# Unit-тесты:               docker compose --profile test run --rm test
# E2E (Playwright):         docker compose --profile e2e run --rm e2e
#
# После смены зависимостей: docker compose up --build --watch -V (-V пересоздаёт анонимные тома,
# иначе контейнер подключит старые node_modules).

services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - '5173:5173'
    environment:
      HOST: 0.0.0.0
    # В slim-образе нет curl, поэтому проверка идёт через node.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    develop:
      watch:
        # Образ нужен заново только при смене зависимостей.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/sandbox/package.json
        - action: rebuild
          path: ./packages/document/package.json
        - action: rebuild
          path: ./packages/store/package.json
        - action: rebuild
          path: ./packages/engine/package.json
        - action: rebuild
          path: ./packages/react/package.json
        - action: rebuild
          path: ./packages/styles/package.json
        # Исходники копируются в контейнер: события файловой системы приходят внутри Linux, polling не нужен.
        - action: sync
          path: ./apps
          target: /app/apps
          ignore: [node_modules/, dist/]
        - action: sync
          path: ./packages
          target: /app/packages
          ignore: [node_modules/, dist/]

  test:
    profiles: ['test']
    build:
      context: .
      target: test

  e2e:
    profiles: ['e2e']
    build:
      context: .
      target: e2e
    environment:
      E2E_BASE_URL: http://dev:5173
    depends_on:
      dev:
        condition: service_healthy
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
